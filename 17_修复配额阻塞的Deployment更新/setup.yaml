apiVersion: v1
kind: Namespace
metadata:
  name: cka-quota
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-cpu
  namespace: cka-quota
spec:
  limits:
  - type: Container
    min:
      cpu: 100m
    max:
      cpu: 500m
    defaultRequest:
      cpu: 200m
    default:
      cpu: 400m
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: application-budget
  namespace: cka-quota
spec:
  hard:
    requests.cpu: 500m
    limits.cpu: "1"
    count/pods: "3"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor
  namespace: cka-quota
spec:
  replicas: 3
  selector:
    matchLabels:
      app: processor
  template:
    metadata:
      labels:
        app: processor
    spec:
      containers:
      - name: worker
        image: nginx:1.27.5
        resources:
          requests:
            cpu: 300m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 64Mi
