apiVersion: v1
kind: Namespace
metadata:
  name: cka-19
---
apiVersion: v1
kind: Namespace
metadata:
  name: cka-19-client
  labels:
    access-zone: trusted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  namespace: cka-19
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger
  template:
    metadata:
      labels:
        app: ledger
    spec:
      containers:
      - name: app
        image: nginx:1.27.5
---
apiVersion: v1
kind: Service
metadata:
  name: ledger
  namespace: cka-19
spec:
  selector:
    app: ledger
  ports:
  - port: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: allowed
  namespace: cka-19-client
  labels:
    role: reader
spec:
  containers:
  - name: client
    image: busybox:1.36
    command:
    - sleep
    - infinity
---
apiVersion: v1
kind: Pod
metadata:
  name: wrong-role
  namespace: cka-19-client
  labels:
    role: other
spec:
  containers:
  - name: client
    image: busybox:1.36
    command:
    - sleep
    - infinity
---
apiVersion: v1
kind: Pod
metadata:
  name: wrong-namespace
  namespace: cka-19
  labels:
    role: reader
spec:
  containers:
  - name: client
    image: busybox:1.36
    command:
    - sleep
    - infinity
