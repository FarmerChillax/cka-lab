apiVersion: v1
kind: Namespace
metadata:
  name: cka-dns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cka-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: nginx
        image: nginx:1.27.5
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: cka-dns
spec:
  selector:
    app: backend
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-client
  namespace: cka-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dns-client
  template:
    metadata:
      labels:
        app: dns-client
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - 203.0.113.53
      containers:
      - name: client
        image: busybox:1.36
        command: ["sh", "-c", "sleep 36000"]
