apiVersion: v1
kind: Namespace
metadata:
  name: cka-21
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy
  namespace: cka-21
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legacy
  template:
    metadata:
      labels:
        app: legacy
    spec:
      containers:
      - name: app
        image: nginx:1.27.5
---
apiVersion: v1
kind: Pod
metadata:
  name: probe
  namespace: cka-21
  labels: {}
spec:
  containers:
  - name: client
    image: busybox:1.36
    command:
    - sleep
    - infinity
---
apiVersion: v1
kind: Service
metadata:
  name: legacy-bridge
  namespace: cka-21
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 80
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: legacy-manual
  namespace: cka-21
  labels:
    kubernetes.io/service-name: legacy-bridge
    endpointslice.kubernetes.io/managed-by: cka-lab
addressType: IPv4
ports:
- name: http
  port: 8081
  protocol: TCP
endpoints:
- addresses:
  - 192.0.2.1
  conditions:
    ready: true
