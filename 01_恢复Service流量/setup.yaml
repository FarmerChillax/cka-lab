apiVersion: v1
kind: Namespace
metadata:
  name: cka-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: cka-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
      - name: nginx
        image: nginx:1.27.5
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /ready
            port: 80
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: cka-lab
spec:
  selector:
    app: catalog-v2
  ports:
  - port: 80
    targetPort: 80
