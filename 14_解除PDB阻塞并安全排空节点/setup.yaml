apiVersion: v1
kind: Namespace
metadata:
  name: cka-maint
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cka-maint
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: maintenance-target
                operator: In
                values: ["true"]
      containers:
      - name: nginx
        image: nginx:1.27.5
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  namespace: cka-maint
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: frontend
