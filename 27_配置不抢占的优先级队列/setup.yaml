apiVersion: v1
kind: Namespace
metadata:
  name: cka-27
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resident
  namespace: cka-27
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resident
  template:
    metadata:
      labels:
        app: resident
    spec:
      containers:
      - name: app
        image: nginx:1.27.5
        ports:
        - containerPort: 80
          hostPort: 19027
      nodeSelector:
        kubernetes.io/hostname: cka-next-worker2
