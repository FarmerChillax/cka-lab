apiVersion: v1
kind: Namespace
metadata:
  name: cka-25
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parser
  namespace: cka-25
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parser
  template:
    metadata:
      labels:
        app: parser
    spec:
      containers:
      - name: parser
        image: python:3.12-alpine
        command:
        - python
        - "-u"
        - "-c"
        - import time; data = bytearray(96 * 1024 * 1024); print('parser ready');
          time.sleep(86400)
        resources:
          requests:
            memory: 16Mi
          limits:
            memory: 48Mi
