apiVersion: v1
kind: Namespace
metadata:
  name: cka-22
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: cka-22
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      containers:
      - name: app
        image: nginx:1.27.5
      nodeSelector:
        kubernetes.io/hostname: cka-next-worker2
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: cka-22
spec:
  selector:
    app: inventory
  ports:
  - port: 80
  internalTrafficPolicy: Local
---
apiVersion: v1
kind: Pod
metadata:
  name: client-a
  namespace: cka-22
  labels: {}
spec:
  nodeSelector:
    kubernetes.io/hostname: cka-next-worker
  containers:
  - name: client
    image: busybox:1.36
    command:
    - sleep
    - infinity
---
apiVersion: v1
kind: Pod
metadata:
  name: client-b
  namespace: cka-22
  labels: {}
spec:
  nodeSelector:
    kubernetes.io/hostname: cka-next-worker2
  containers:
  - name: client
    image: busybox:1.36
    command:
    - sleep
    - infinity
