apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-api
  namespace: cka-config
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: report-api
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: report-api
    spec:
      containers:
      - command:
        - sh
        - -c
        - while true; do sleep 3600; done
        env:
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: report-credentials-v2
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: report-credentials-v2
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        name: api
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/report
          name: runtime-config
          readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: runtime-config
        projected:
          defaultMode: 0400
          sources:
          - configMap:
              items:
              - key: app.properties
                path: app.properties
              name: report-config-v2
          - secret:
              items:
              - key: username
                path: credentials/username
              - key: password
                path: credentials/password
              name: report-credentials-v2
