apiVersion: v1
kind: Namespace
metadata:
  name: cka-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: report-config-v1
  namespace: cka-config
immutable: true
data:
  app.properties: |
    MODE=maintenance
    REPORT_PATH=/var/reports
---
apiVersion: v1
kind: Secret
metadata:
  name: report-credentials-v1
  namespace: cka-config
immutable: true
type: Opaque
stringData:
  username: reporter
  password: old-password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-api
  namespace: cka-config
spec:
  replicas: 2
  selector:
    matchLabels:
      app: report-api
  template:
    metadata:
      labels:
        app: report-api
    spec:
      containers:
      - name: api
        image: busybox:1.36
        command: ["sh", "-c", "while true; do sleep 3600; done"]
        env:
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: report-credentials-v1
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: report-credentials-v1
              key: password
        volumeMounts:
        - name: runtime-config
          mountPath: /etc/report
          readOnly: true
      volumes:
      - name: runtime-config
        projected:
          sources:
          - configMap:
              name: report-config-v1
              items:
              - key: app.properties
                path: app.properties
          - secret:
              name: report-credentials-v1
              items:
              - key: username
                path: credentials/username
              - key: password
                path: credentials/password
