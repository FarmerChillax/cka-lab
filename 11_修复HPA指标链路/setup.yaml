apiVersion: v1
kind: Namespace
metadata:
  name: cka-scale
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scale-api
  namespace: cka-scale
spec:
  replicas: 1
  selector:
    matchLabels: {app: scale-api}
  template:
    metadata:
      labels: {app: scale-api}
    spec:
      containers:
      - name: server
        image: registry.k8s.io/e2e-test-images/agnhost:2.53
        args: ["netexec", "--http-port=8080"]
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: scale-api
  namespace: cka-scale
spec:
  selector: {app: scale-api}
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scale-api
  namespace: cka-scale
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scale-api
  minReplicas: 2
  maxReplicas: 5
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
---
apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  namespace: cka-scale
spec:
  containers:
  - name: load
    image: busybox:1.36
    command: ["sh", "-c", "while true; do wget -q -O- http://scale-api >/dev/null; done"]
