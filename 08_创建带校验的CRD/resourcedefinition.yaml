apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.lab.cka.example
spec:
  group: lab.cka.example
  scope: Namespaced
  names:
    plural: widgets
    singular: widget
    kind: Widget
  
  versions:
    - name: v1
      additionalPrinterColumns:
      - name: Desired
        type: integer
        jsonPath: .spec.replicas
      # 每个版本都可以通过 served 标志来独立启用或禁止
      served: true
      # 其中一个且只有一个版本必需被标记为存储版本
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
              - image
              - replicas
              properties:
                image:
                  type: string
                  minLength: 1
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 5
            status:
             type: object
             properties:
               readyReplicas:
                 type: integer
                 minimum: 0
