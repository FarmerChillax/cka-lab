apiVersion: v1
kind: Namespace
metadata:
  name: cka-topology
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: cka-topology
spec:
  replicas: 4
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: nginx
        image: nginx:1.27.5
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
