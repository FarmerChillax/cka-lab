apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-web
  namespace: cka-rollout
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: release-web
  template:
    metadata:
      labels:
        app: release-web
    spec:
      containers:
      - name: nginx
        image: nginx:cka-invalid-tag
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
