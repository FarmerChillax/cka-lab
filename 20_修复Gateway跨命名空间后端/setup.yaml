apiVersion: v1
kind: Namespace
metadata:
  name: cka-20
---
apiVersion: v1
kind: Namespace
metadata:
  name: cka-20-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports
  namespace: cka-20-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reports
  template:
    metadata:
      labels:
        app: reports
    spec:
      containers:
      - name: app
        image: nginx:1.27.5
---
apiVersion: v1
kind: Service
metadata:
  name: reports
  namespace: cka-20-backend
spec:
  selector:
    app: reports
  ports:
  - port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cka-reports
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
  namespace: cka-20
spec:
  gatewayClassName: cka-reports
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    hostname: reports.example.test
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: reports
  namespace: cka-20
spec:
  parentRefs:
  - name: edge
    sectionName: http
  hostnames:
  - reports.example.test
  rules:
  - backendRefs:
    - name: reports
      namespace: cka-20-backend
      port: 80
