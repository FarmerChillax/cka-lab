apiVersion: v1
kind: Namespace
metadata:
  name: cka-29
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: source
  namespace: cka-29
spec:
  storageClassName: standard
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: destination
  namespace: cka-29
spec:
  storageClassName: standard
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: archive
  namespace: cka-29
spec:
  replicas: 1
  selector:
    matchLabels:
      app: archive
  template:
    metadata:
      labels:
        app: archive
    spec:
      containers:
      - name: archive
        image: busybox:1.36
        command:
        - sleep
        - infinity
        volumeMounts:
        - name: store
          mountPath: "/data"
      volumes:
      - name: store
        persistentVolumeClaim:
          claimName: source
