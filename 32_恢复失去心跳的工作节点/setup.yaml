apiVersion: v1
kind: Namespace
metadata:
  name: cka-32
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary
  namespace: cka-32
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canary
  template:
    metadata:
      labels:
        app: canary
    spec:
      containers:
      - name: app
        image: nginx:1.27.5
      nodeSelector:
        kubernetes.io/hostname: cka-kubelet-worker2
