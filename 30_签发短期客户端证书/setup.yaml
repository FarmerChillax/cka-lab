apiVersion: v1
kind: Namespace
metadata:
  name: cka-30
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory
  namespace: cka-30
data:
  mode: training
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: viewer
  namespace: cka-30
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: viewer
  namespace: cka-30
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: viewer
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: cka-30-viewer
