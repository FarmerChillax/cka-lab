apiVersion: v1
kind: Namespace
metadata:
  name: cka-23
---
apiVersion: v1
kind: Service
metadata:
  name: peer
  namespace: cka-23
spec:
  selector:
    app: peer
  ports:
  - name: http
    port: 80
  clusterIP: None
  publishNotReadyAddresses: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: peer
  namespace: cka-23
spec:
  serviceName: peer
  replicas: 2
  selector:
    matchLabels:
      app: peer
  template:
    metadata:
      labels:
        app: peer
    spec:
      initContainers:
      - name: discover-self
        image: busybox:1.36
        command:
        - sh
        - "-c"
        - until nslookup "$HOSTNAME.peer.cka-23.svc.cluster.local"; do sleep 2; done
      containers:
      - name: nginx
        image: nginx:1.27.5
---
apiVersion: v1
kind: Pod
metadata:
  name: probe
  namespace: cka-23
  labels: {}
spec:
  containers:
  - name: client
    image: busybox:1.36
    command:
    - sleep
    - infinity
