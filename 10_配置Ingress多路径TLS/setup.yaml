apiVersion: v1
kind: Namespace
metadata:
  name: cka-edge
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-nginx
  namespace: cka-edge
data:
  default.conf: |
    server { listen 80; location / { return 200 "web-backend\n"; } }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-nginx
  namespace: cka-edge
data:
  default.conf: |
    server { listen 80; location / { return 200 "api-backend\n"; } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: cka-edge
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
      - name: nginx
        image: nginx:1.27.5
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: config
        configMap:
          name: web-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: cka-edge
spec:
  selector: {app: web}
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: cka-edge
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
      - name: nginx
        image: nginx:1.27.5
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: config
        configMap:
          name: api-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: cka-edge
spec:
  selector: {app: api}
  ports:
  - name: http-api
    port: 8080
    targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: ingress-probe
  namespace: cka-edge
spec:
  containers:
  - name: probe
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
